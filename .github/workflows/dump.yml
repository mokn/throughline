name: weekly dump

# Attaches one snapshot of the archive to a GitHub Release each week, after
# the Monday watcher run, and by hand. Never on pull_request. Keeps the twelve
# most recent dump-* releases and deletes older ones; git holds the history.
on:
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dump
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: build snapshot
        run: |
          python3 dump.py dist
          python3 dump.py --notes dist > dist/notes.md
          echo "tag=$(python3 -c 'import json; print(json.load(open("dist/manifest.json"))["tag"])')" >> "$GITHUB_OUTPUT"
        id: build
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; not replacing it"
            exit 0
          fi
          gh release create "$TAG" dist/markets-*.jsonl.gz dist/changes-*.jsonl.gz dist/stats-*.json dist/SHA256SUMS \
            --title "Archive snapshot $TAG" --notes-file dist/notes.md --latest=false
      - name: keep the twelve most recent snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("dump-"))] | sort_by(.createdAt) | reverse | .[12:] | .[].tagName' \
          | while read -r old; do
              echo "deleting $old"
              gh release delete "$old" --cleanup-tag --yes
            done
