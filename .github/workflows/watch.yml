name: watch resolution rules

# Runs on schedule and by hand only. Never on pull_request, so a fork cannot
# run code from a PR with this repository's write token.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: snapshot
        run: python3 watch.py
      - name: commit if changed
        run: |
          git config user.name "rules-watcher"
          git config user.email "rules-watcher@users.noreply.github.com"
          git add archive
          if git diff --cached --quiet; then
            echo "archive unchanged"
          else
            git commit -m "archive: $(tail -1 archive/runs.log)"
            git push
          fi
