name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 test.py
      - run: python3 -I throughline/tests/test_client.py
      - run: python3 throughline/tests/test_cli.py
      - run: python3 -m pip install .
      - run: throughline --version
      - run: python3 -I -c 'from importlib.metadata import distribution; from throughline import Throughline; assert not distribution("throughline-news-client").requires; assert callable(Throughline.start_from_now)'

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: node --test throughline/js/tests/
